<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="kolom-kiri">
            <img src="img/login_image.png" alt="">
        </div>
        <form class="kolom-kanan">
            <h1 class="judul">Login to your <span>acount</span></h1>
            <div class="email">
                <label for="">Email</label>
                <input type="text" class="input-box" placeholder="Input your email">
            </div>
            <div class="password">
                <label for="">Password</label>
                <input type="password" class="input-box" placeholder="Input your Password">
            </div>
            <div class="remember">
                <div >
                    <input type="checkbox">
                    <label for="">Remember me</label>
                </div>
                <a href="#">Forgot Password</a>
            </div>
            <div >
                <button class="login">Login</button>
            </div>
            <div class="signup">
                Don't have an account?
                <a href="">Signup</a>
            </div>
        </form>
    </div>


    <div class="quis">
        <h1>Awas Salah</h1>
    </div>














</body>
</html>
